name: Size Limit

on:
  pull_request:
    branches:
      - master
      - test
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: size-limit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current branch
        run: pnpm build

      - name: Measure current branch
        shell: bash
        run: |
          set +e
          pnpm exec size-limit --json > "$RUNNER_TEMP/size-current.json"
          exit 0

      - name: Prepare base branch
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          if [ ! -f "$RUNNER_TEMP/base/.size-limit.ts" ] && [ ! -f "$RUNNER_TEMP/base/.size-limit.js" ]; then
            cp .size-limit.ts "$RUNNER_TEMP/base/.size-limit.ts"
          fi

      - name: Install base dependencies
        working-directory: ${{ runner.temp }}/base
        run: |
          pnpm install --frozen-lockfile
          pnpm add -Dw --save-exact size-limit@11.2.0 @size-limit/esbuild@11.2.0 @size-limit/file@11.2.0

      - name: Build base branch
        working-directory: ${{ runner.temp }}/base
        run: pnpm build

      - name: Measure base branch
        shell: bash
        working-directory: ${{ runner.temp }}/base
        run: |
          set +e
          pnpm exec size-limit --json > "$RUNNER_TEMP/size-base.json"
          exit 0

      - name: Generate report
        id: report
        run: pnpm exec tsx scripts/size-limit-report.ts "$RUNNER_TEMP/size-current.json" "$RUNNER_TEMP/size-base.json" "$RUNNER_TEMP/size-limit-report.md"

      - name: Comment report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/size-limit-report.md`,
              'utf8',
            );
            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                },
              );
              const previous = comments.find((comment) =>
                comment.body.includes('<!-- size-limit-report -->'),
              );

              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              console.log(`无法写入包体积报告评论：${error.message}`);
            }

      - name: Enforce size limit
        if: steps.report.outputs.failed == 'true'
        run: |
          echo "有包超过体积预算，请查看 PR 体积报告。"
          exit 1

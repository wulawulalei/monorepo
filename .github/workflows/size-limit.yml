name: Package Size Report

on:
  pull_request:
    branches:
      - master
      - test
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: size-limit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect current commit package changes
        id: package_changes
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 仅当前 head 提交改动包内容时执行，避免后续无包变更的提交重复测量。
          package_dirs=$(
            git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA" -- packages \
              | awk -F/ 'NF > 1 { print $2 }' \
              | sort -u
          )
          package_names=$(
            for package_dir in $package_dirs; do
              manifest="packages/$package_dir/package.json"
              if [ -f "$manifest" ]; then
                jq -r '.name // empty' "$manifest"
              elif git cat-file -e "${HEAD_SHA}^:$manifest" 2>/dev/null; then
                git show "${HEAD_SHA}^:$manifest" | jq -r '.name // empty'
              fi
            done | sort -u
          )

          if [ -z "$package_names" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "包内容无变更，跳过包体积报告。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "names<<PACKAGE_NAMES"
              echo "$package_names"
              echo "PACKAGE_NAMES"
            } >> "$GITHUB_OUTPUT"
            echo "检测到以下包内容变更："
            echo "$package_names"
          fi

      - name: Set up pnpm
        if: steps.package_changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        if: steps.package_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.package_changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build current branch
        if: steps.package_changes.outputs.changed == 'true'
        run: pnpm build

      - name: Measure current branch
        if: steps.package_changes.outputs.changed == 'true'
        shell: bash
        run: pnpm exec size-limit --json > "$RUNNER_TEMP/size-current.json"

      - name: Prepare base branch
        if: steps.package_changes.outputs.changed == 'true'
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          if [ ! -f "$RUNNER_TEMP/base/.size-limit.ts" ] && [ ! -f "$RUNNER_TEMP/base/.size-limit.js" ]; then
            cp .size-limit.ts "$RUNNER_TEMP/base/.size-limit.ts"
          fi

      - name: Install base dependencies
        if: steps.package_changes.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/base
        run: |
          pnpm install --frozen-lockfile
          pnpm add -Dw --save-exact size-limit@11.2.0 @size-limit/esbuild@11.2.0 @size-limit/file@11.2.0

      - name: Build base branch
        if: steps.package_changes.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/base
        run: pnpm build

      - name: Measure base branch
        if: steps.package_changes.outputs.changed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/base
        run: pnpm exec size-limit --json > "$RUNNER_TEMP/size-base.json"

      - name: Generate report
        id: report
        if: steps.package_changes.outputs.changed == 'true'
        env:
          CHANGED_PACKAGES: ${{ steps.package_changes.outputs.names }}
        run: pnpm exec tsx scripts/size-limit-report.ts "$RUNNER_TEMP/size-current.json" "$RUNNER_TEMP/size-base.json" "$RUNNER_TEMP/size-limit-report.md" "$CHANGED_PACKAGES"

      - name: Comment report
        if: steps.package_changes.outputs.changed == 'true' && steps.report.outputs.has_report == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/size-limit-report.md`,
              'utf8',
            );
            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                },
              );
              const previous = comments.find((comment) =>
                comment.body.includes('<!-- size-limit-report -->'),
              );

              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              console.log(`无法写入包体积报告评论：${error.message}`);
            }
